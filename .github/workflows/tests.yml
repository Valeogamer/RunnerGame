name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Смоук-тесты логики
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Синтаксис всех скриптов
        run: |
          for f in js/*.js test/*.js; do
            node --check "$f"
          done

      - name: Тесты игровой логики
        run: node test/smoke.js
